# SidTree code quality rules. Run: scripts/check.sh
included:
  - Sources
  - scripts

# Stricter than the defaults where it catches bugs or unclear code.
opt_in_rules:
  - array_init
  - closure_end_indentation
  - closure_spacing
  - collection_alignment
  - contains_over_filter_count
  - contains_over_filter_is_empty
  - contains_over_first_not_nil
  - contains_over_range_nil_comparison
  - discouraged_none_name
  - empty_collection_literal
  - empty_count
  - empty_string
  - explicit_init
  - fatal_error_message
  - first_where
  - flatmap_over_map_reduce
  - force_unwrapping
  - identical_operands
  - joined_default_parameter
  - last_where
  - legacy_multiple
  - literal_expression_end_indentation
  - modifier_order
  - operator_usage_whitespace
  - overridden_super_call
  - prefer_self_in_static_references
  - prefer_zero_over_explicit_init
  - private_swiftui_state
  - reduce_into
  - redundant_nil_coalescing
  - redundant_type_annotation
  - sorted_first_last
  - toggle_bool
  - unneeded_parentheses_in_closure_argument
  - unowned_variable_capture
  - vertical_parameter_alignment_on_call
  - vertical_whitespace_closing_braces
  - vertical_whitespace_opening_braces
  - yoda_condition

disabled_rules:
  # Git output is decoded leniently on purpose: invalid UTF-8 must never drop a whole diff or log.
  - optional_data_string_conversion
  # Explicit `{ … }` blocks around SwiftUI modifiers read better than this rule's preferred form.
  - multiple_closures_with_trailing_closure

# Drawing and parsing code uses short, conventional names (x, y, i, r, p).
identifier_name:
  min_length: 1
  max_length: 50
  excluded: [id, x, y]

line_length:
  warning: 160
  error: 200
  ignores_comments: true
  ignores_urls: true

file_length:
  warning: 1000
  error: 1400
type_body_length:
  warning: 500
  error: 800
function_body_length:
  warning: 80
  error: 120
cyclomatic_complexity:
  warning: 20
  error: 30
  ignores_case_statements: true
large_tuple:
  warning: 4
  error: 5
function_parameter_count:
  warning: 7
  error: 9
nesting:
  type_level: 2

reporter: xcode
