name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 30
    env:
      # Optional: with these secrets set, releases are signed and notarized (no Gatekeeper warning).
      MACOS_CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE }}
      MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
      APPLE_ID: ${{ secrets.APPLE_ID }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
    steps:
      - uses: actions/checkout@v5

      - name: Build
        run: ./scripts/build.sh release

      - name: Sign and notarize app
        if: startsWith(github.ref, 'refs/tags/v') && env.MACOS_CERTIFICATE != ''
        run: ./scripts/sign-and-notarize.sh app

      - name: Package
        run: |
          VERSION="$(cat VERSION)"
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            [ "${GITHUB_REF_NAME#v}" = "$VERSION" ] || { echo "Tag $GITHUB_REF_NAME does not match VERSION $VERSION"; exit 1; }
          fi
          ditto -c -k --keepParent build/SidTree.app "build/SidTree-$VERSION.zip"
          ./scripts/make-dmg.sh

      - name: Sign and notarize disk image
        if: startsWith(github.ref, 'refs/tags/v') && env.MACOS_CERTIFICATE != ''
        run: ./scripts/sign-and-notarize.sh dmg

      - uses: actions/upload-artifact@v6
        with:
          name: SidTree
          path: |
            build/SidTree-*.zip
            build/SidTree-*.dmg
          retention-days: 14

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          # Release notes = this version's section of CHANGELOG.md
          awk -v v="$VERSION" '
            $0 ~ "^## \\[" v "\\]" { on = 1; next }
            on && /^## / { exit }
            on { print }
          ' CHANGELOG.md > notes.md
          gh release create "$GITHUB_REF_NAME" build/SidTree-*.dmg build/SidTree-*.zip \
            --title "SidTree $VERSION" --notes-file notes.md
