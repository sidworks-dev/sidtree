name: Release

# Runs only for a version tag (pushed by scripts/release.sh), or by hand via "Run workflow".
# Builds SidTree and publishes release v<VERSION> with the notes from CHANGELOG.md.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      ref:
        description: Version tag to (re)build, e.g. v0.4.0
        required: true
      runner:
        description: macOS runner
        type: choice
        default: macos-15
        options: [macos-15, macos-15-intel, macos-26]

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  release:
    # The universal app (Apple Silicon + Intel) builds on either kind of runner.
    runs-on: ${{ inputs.runner || 'macos-15' }}
    timeout-minutes: 30
    env:
      # Optional: with these secrets set, releases are signed and notarized (no Gatekeeper warning).
      MACOS_CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE }}
      MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
      APPLE_ID: ${{ secrets.APPLE_ID }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.ref || github.ref }}

      - name: Read version
        id: version
        run: |
          VERSION="$(tr -d '[:space:]' < VERSION)"
          TAG="${{ inputs.ref || github.ref_name }}"
          [ "$TAG" = "v$VERSION" ] || { echo "Tag $TAG does not match VERSION $VERSION"; exit 1; }
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          if gh release view "v$VERSION" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "Release v$VERSION already exists; building only."
          fi

      - name: Build (compiler warnings fail the release)
        run: STRICT=1 ./scripts/build.sh release

      - name: Sign and notarize app
        if: steps.version.outputs.exists != 'true' && env.MACOS_CERTIFICATE != ''
        run: ./scripts/sign-and-notarize.sh app

      - name: Package
        run: |
          ditto -c -k --keepParent build/SidTree.app "build/SidTree-${{ steps.version.outputs.version }}.zip"
          bash -x ./scripts/make-dmg.sh

      - name: Sign and notarize disk image
        if: steps.version.outputs.exists != 'true' && env.MACOS_CERTIFICATE != ''
        run: ./scripts/sign-and-notarize.sh dmg

      - uses: actions/upload-artifact@v6
        with:
          name: SidTree
          path: |
            build/SidTree-*.zip
            build/SidTree-*.dmg
          retention-days: 14

      - name: Publish release
        if: steps.version.outputs.exists != 'true'
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          # Release notes = this version's section of CHANGELOG.md
          awk -v v="$VERSION" '
            $0 ~ "^## \\[" v "\\]" { on = 1; next }
            on && /^## / { exit }
            on { print }
          ' CHANGELOG.md > notes.md
          # The tag already exists (pushed with git), so no new ref is created here.
          gh release create "v$VERSION" build/SidTree-*.dmg build/SidTree-*.zip \
            --verify-tag --title "SidTree $VERSION" --notes-file notes.md
