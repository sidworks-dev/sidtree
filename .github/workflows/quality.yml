name: Quality

# Fast checks on Linux for every push and pull request: no waiting for macOS runners.
# Compiler warnings are enforced by the Release workflow and scripts/check.sh.
on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  swiftlint:
    runs-on: ubuntu-latest
    container: ghcr.io/realm/swiftlint:0.65.1
    steps:
      - uses: actions/checkout@v5
      - name: SwiftLint (strict)
        run: swiftlint lint --strict --reporter github-actions-logging

  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: ShellCheck
        run: shellcheck scripts/*.sh scripts/sidtree
      - name: CLI launcher
        run: ./scripts/test-cli.sh
